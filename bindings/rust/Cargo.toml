[workspace]
resolver = "3"
members = ["fig", "fig-macros", "fig-sys", "fig-sys-*"]

[workspace.package]
version = "5.1.1"
edition = "2024"
# The oldest toolchain the workspace builds on. Edition 2024 alone needs 1.85;
# fig-macros writes let chains (`if a && let Some(x) = …`), stable since 1.88.
# Checked with `cargo +1.88 test --workspace --all-features`; 1.85 refuses the
# let chains.
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Shared across the workspace so every crate pins one set of versions. The
# internal `fig*` crates all share fig's one version, decided in build.zig.zon;
# `dx release` and `zig build version-sync` rewrite these `version = "…"` fields
# in lockstep, and `zig build version-check` fails on drift.
[workspace.dependencies]
fig-macros = { path = "fig-macros", version = "5.1.1" }
# default-features = false so `fig`'s own per-language features are the sole
# driver of which formats fig-sys compiles (fig forwards json/yaml/… -> fig-sys).
fig-sys = { path = "fig-sys", version = "5.1.1", default-features = false }
fig-sys-macos-arm64 = { path = "fig-sys-macos-arm64", version = "5.1.1" }
fig-sys-linux-x64-gnu = { path = "fig-sys-linux-x64-gnu", version = "5.1.1" }
fig-sys-linux-arm64-gnu = { path = "fig-sys-linux-arm64-gnu", version = "5.1.1" }
fig-sys-windows-x64-msvc = { path = "fig-sys-windows-x64-msvc", version = "5.1.1" }
fig-sys-wasm32 = { path = "fig-sys-wasm32", version = "5.1.1" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
