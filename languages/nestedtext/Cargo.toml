[package]
name = "fig-nestedtext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# fig's Rust workspace; this crate sits in its language's package.
workspace = "../../bindings/rust"
description = "NestedText for fig: fig's own parser, printer and editing rules for the language, in pure Rust (fig-core's), registered with fig's core."
repository = "https://github.com/diaryx-org/fig"
homepage = "https://github.com/diaryx-org/fig"
documentation = "https://docs.rs/fig-nestedtext"
readme = "README.md"
keywords = ["config", "fig", "nestedtext", "parser"]
categories = ["config", "parser-implementations"]
include = [
    "rust/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
path = "rust/lib.rs"

[features]
# `from_str`, `to_string` and the rest: typed values to and from NestedText
# through serde, as `serde_json`'s are. On by default; a program that maps
# its types with fig's own derive turns it off (`default-features = false`).
default = ["serde"]
serde = ["fig/serde", "dep:serde"]

[dependencies]
fig = { workspace = true }
# The language itself: fig-core's port of the Zig beside this file.
fig-core = { workspace = true }
serde = { version = "1", optional = true }
