[package]
name = "fig-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A member of fig's one Rust workspace, bindings/rust.
workspace = "../../bindings/rust"
description = "fig's command-line tool, in Rust"

[[bin]]
name = "fig"
path = "src/main.rs"

[dependencies]
fig-core = { workspace = true }
# fig's ten languages, each the language alone (no `fig` binding),
# registered at startup (`languages::init`).
fig-json = { workspace = true }
fig-yaml = { workspace = true }
fig-toml = { workspace = true }
fig-zon = { workspace = true }
fig-figl = { workspace = true }
fig-ini = { workspace = true }
fig-dotenv = { workspace = true }
fig-properties = { workspace = true }
fig-plist = { workspace = true }
fig-nestedtext = { workspace = true }

[features]
# fig-lsp diagnoses through the figl parser (`fig_figl`).
default = ["figl"]
figl = []
# The canonical oracle format, compiled out of a release CLI as Zig's
# `-Dcanonical=true` is off by default.
canonical = []
# The WASI build for `@diaryx/fig-wasi`, whose host serves languages
# (Zig's `-Dwasi-host=true`); only meaningful on a wasi target.
wasi-host = []
