[package]
name = "fig-sys-android-arm64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Prebuilt fig core and language libraries for aarch64-linux-android. Support crate for fig-sys; not for direct use."
repository = "https://github.com/diaryx-org/fig"
# The build script hands `lib/`'s location to `fig-sys` via this
# `links` key (as `DEP_FIG_PREBUILT_ANDROID_ARM64_LIBDIR`). Unique per payload crate.
links = "fig_prebuilt_android_arm64"
# Allowlist: the prebuilt archives plus the trivial crate skeleton. `lib/` is
# git-ignored and populated by scripts/build-payload-lib.sh (or CI) before publish.
include = ["build.rs", "src/lib.rs", "lib/*.a", "README.md"]

[lib]
name = "fig_sys_android_arm64"
path = "src/lib.rs"
