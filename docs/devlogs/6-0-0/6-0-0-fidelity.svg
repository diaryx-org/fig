<text x="358" y="390" class="b" font-size="10.5" text-anchor="start" font-weight="normal" >reflowed, and every</text>
<text x="358" y="404" class="b" font-size="10.5" text-anchor="start" font-weight="normal" >object's keys sorted</text>
<text x="512" y="399" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >JSON only</text>
<text x="28" y="456" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >The files had comments, a blank line, an inline table, a hex number, 1.50, a single-quoted string and a datetime,</text>
<text x="28" y="470" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >and in JSON a 20-digit integer and an escaped slash. fig changes the one line; the others write the file afresh.</text>
<text x="28" y="484" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >Lines counted by diff. yq is mikefarah's Go yq. jq 1.7.1, jaq 3.1.1, gojq 0.12.19, 2026-10-14.</text>

