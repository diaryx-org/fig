<text x="168" y="266" class="b" font-size="10.5" text-anchor="start" font-weight="normal" >comments dropped, 0x1F</text>
<text x="168" y="280" class="b" font-size="10.5" text-anchor="start" font-weight="normal" >made 31, reindented</text>
