name: Fuzz
on:
  schedule:
  # 07:17 UTC daily. The odd minute is not cosmetic: scheduled runs are
  # best-effort — GitHub queues them on shared infrastructure and will delay or
  # outright drop them under load — and the top of the hour is the single most
  # contended slot there is.
  - cron: 17 7 * * *
  workflow_dispatch:
    inputs:
      # Also runnable by hand from the Actions tab. This is not a convenience: a
      # `schedule:` trigger only ever fires from the default branch, using the copy of
      # this file that is on main. That makes the button the ONLY way to exercise a
      # change to this workflow without merging it first and waiting until tomorrow.
      # `budget` exists so such a test run can be told to take a minute instead of a
      # quarter of an hour.
      budget:
        description: 'How long to fuzz in all, shared between the targets: seconds, or a number with s, m or h (e.g. 1m for a quick check of this workflow).'
        required: false
        default: 15m
permissions:
  contents: read
  issues: write # the failure path opens (or comments on) an issue
# One fuzz run at a time, and never cancel one already in flight. Unlike CI,
# there is no newer commit that supersedes a run here — a cancelled run is just
# discarded CPU.
concurrency: { group: fuzz, cancel-in-progress: false }
jobs:
  fuzz:
    name: Fuzz the hand-written parsers
    runs-on: ubuntu-latest
    # Belt and braces, NOT the budget — libFuzzer's `-max_total_time` is. This
    # only exists to stop a wedged run burning the full 6h job limit, so it wants
    # to stay comfortably above the budget plus build time. If it ever actually
    # fires, something is stuck rather than slow: no issue gets filed (a job
    # timeout cancels the steps below), the run just goes red.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    # cargo-fuzz needs nightly: it builds the targets with `-Zsanitizer=address`
    # and libFuzzer's coverage instrumentation.
    - uses: dtolnay/rust-toolchain@nightly
    # Caches the fuzz project's build and ~/.cargo/bin, so the cargo-fuzz
    # install below is a no-op on a warm cache.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |-
          . -> target
          fuzz -> target
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked
    # Starts each target's corpus from fig-fuzz's seeds (every language's own
    # samples, those printed as canonical text, and hand-written edges) rather
    # than from the empty input.
    - name: Seed the corpus
      run: cargo run --locked -p fig-fuzz --bin fig-fuzz-seed -- fuzz/corpus
    # Each target gets an equal share of the budget, and both run even when the
    # first fails, so one finding cannot hide another.
    #
    # The exit code is the signal: libFuzzer exits nonzero on a panic, an
    # AddressSanitizer report, a stack overflow, an input over `-rss_limit_mb`
    # (2 GB by default), or an input slower than `-timeout` — so a parser that
    # loops forever is a finding too, which a budget-only run could not tell
    # from a clean one. `-timeout` is generous because a shared runner is slow
    # and the build carries ASan; no input of `-max_len` bytes should take a
    # parser anywhere near it.
    - name: Fuzz
      id: fuzz
      env: { BUDGET: '${{ inputs.budget }}' }
      run: |-
        # Not -e (Actions' default): a failing target must not stop the next one.
        set +e -u

        budget="${BUDGET:-15m}"
        case "$budget" in
          *h) seconds=$(( ${budget%h} * 3600 )) ;;
          *m) seconds=$(( ${budget%m} * 60 )) ;;
          *s) seconds=${budget%s} ;;
          *)  seconds=$budget ;;
        esac
        targets="detect canonical_round_trip"
        share=$(( seconds / 2 ))
        [ "$share" -ge 1 ] || share=1
        echo "Fuzzing for ${budget}: ${share}s per target."

        failed=""
        for target in $targets; do
          echo "::group::${target}"
          cargo fuzz run "$target" -- \
            -max_total_time="$share" -max_len=2048 -timeout=30 \
            -dict="fuzz/dict/${target}.dict" -print_final_stats=1 \
            2>&1 | tee "fuzz-${target}.log"
          code="${PIPESTATUS[0]}"
          echo "::endgroup::"
          if [ "$code" -ne 0 ]; then
            echo "::error::${target} found a failing input (exit ${code}) — see its log and the attached artifacts."
            failed="${failed} ${target}"
          fi
        done

        if [ -n "$failed" ]; then
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "Budget of ${budget} spent with no findings — that is a pass."
    # The failing inputs are the bug report: cargo-fuzz writes each to
    # fuzz/artifacts/<target>/ (`crash-…`, `timeout-…`, `oom-…`). The corpus rides
    # along so a local run can resume where this one stopped.
    - name: Upload failing inputs, corpus and fuzzer logs
      if: failure() && steps.fuzz.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-corpus-${{ github.run_id }}
        if-no-files-found: ignore
        path: |-
          fuzz/artifacts
          fuzz/corpus
          fuzz-*.log
    # Deduped on the `fuzz` label rather than filing a fresh issue per night: an
    # unfixed crash is deterministic, so it would otherwise reopen every morning
    # until someone got round to it, and issue spam is how a nightly job gets muted.
    - name: Report the failure
      if: failure() && steps.fuzz.outcome == 'failure'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FAILED: ${{ steps.fuzz.outputs.failed }}
      run: |-
        set -eu

        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        inputs="$(cd fuzz && find artifacts -type f | sort | sed 's/^/    /')"
        body="$(cat <<EOF
        The nightly fuzz run failed: a target (${FAILED:-see the log}) found an input
        that panics, overflows the stack, hangs, or violates a parser invariant.

        - Run: ${run_url}
        - Failing inputs, corpus and logs: attached to that run as \`fuzz-corpus-${GITHUB_RUN_ID}\`.

        Failing inputs, under \`fuzz/\`:

        ${inputs:-    (none written; the log says why)}

        The target's log carries the panic message or the stack, so start there. To
        reproduce, unzip that artifact into \`fuzz/\` (so its \`artifacts\` and
        \`corpus\` directories land there) and run the failing input alone:

        \`\`\`
        cargo +nightly fuzz run <target> fuzz/artifacts/<target>/<file>
        \`\`\`

        \`cargo +nightly fuzz tmin <target> <that file>\` shrinks it first. Once fixed,
        add the input to that target's seeds in rust/fig-fuzz so every PR keeps it fixed.

        See docs/testing.md.
        EOF
        )"

        # The label doubles as this job's dedupe key, so it has to exist before the
        # query below can find anything filed under it.
        gh label create fuzz --color B60205 --description "Found by the nightly fuzzer" 2>/dev/null || true

        existing="$(gh issue list --label fuzz --state open --limit 1 --json number --jq '.[0].number // empty')"
        if [ -n "$existing" ]; then
          echo "fuzz issue #${existing} is already open — commenting on it."
          gh issue comment "$existing" --body "$body"
        else
          gh issue create --title "Nightly fuzz run failed" --label fuzz --body "$body"
        fi
