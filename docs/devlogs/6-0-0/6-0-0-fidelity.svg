<text x="548" y="204" class="b" font-size="10.5" text-anchor="start" font-weight="normal" >key moved, blank line</text>
<text x="548" y="218" class="b" font-size="10.5" text-anchor="start" font-weight="normal" >gone, quotes changed</text>
