<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="Wall time of fig 5.2 and 6.0 on a large TOML file">
<title>Wall time of fig 5.2 and 6.0 on a large TOML file</title>
<style>
  .t { font-family: Iowan Old Style, Palatino, Georgia, serif }
  .b, .m, .k { font-family: Helvetica Neue, Helvetica, Arial, sans-serif }
  .mono { font-family: SF Mono, Menlo, Consolas, monospace }
  .grid, .axis, .box, .boxp, .chip, .card { stroke-width:1 }
  .ln { stroke-width:1.6; fill:none }

  .card { fill:#FAFAF9; stroke:#E3E1DC }
  .t { fill:#2C2130 } .b { fill:#5E4A66 } .m { fill:#8A7590 } .k { fill:#2C2130 }
  .plum { fill:#52355C } .pink { fill:#D4576B } .stem { fill:#7A5A37 }
  .soft { fill:#52355C; fill-opacity:.4 }
  .grid { stroke:#E3E1DC } .axis { stroke:#C7C4BD }
  .box { fill:#F2F1EE; stroke:#E3E1DC }
  .boxp { fill:#52355C; fill-opacity:.09; stroke:#52355C; stroke-opacity:.6 }
  .chip { fill:#FFFFFF; stroke:#E3E1DC }
  .ln { stroke:#52355C }
  .g-stem { stroke:#7A5A37 } .g-skin { fill:#52355C } .g-mid { fill:#F2E6D8 }
  .g-flesh { fill:#D4576B } .g-seed { fill:#F6EADC }
  @media (prefers-color-scheme: dark) {
  .card { fill:#161517; stroke:#333136 }
  .t { fill:#EFE6F1 } .b { fill:#C9B6CE } .m { fill:#8E7A96 } .k { fill:#EFE6F1 }
  .plum { fill:#7A5187 } .pink { fill:#E06A7D } .stem { fill:#B08954 }
  .soft { fill:#7A5187; fill-opacity:.4 }
  .grid { stroke:#333136 } .axis { stroke:#4A474D }
  .box { fill:#1F1E21; stroke:#333136 }
  .boxp { fill:#7A5187; fill-opacity:.09; stroke:#7A5187; stroke-opacity:.6 }
  .chip { fill:#2A292D; stroke:#333136 }
  .ln { stroke:#7A5187 }
  .g-stem { stroke:#B08954 } .g-skin { fill:#7A5187 } .g-mid { fill:#EEDFCC }
  .g-flesh { fill:#E06A7D } .g-seed { fill:#F3E4CF }
  }
</style>
<defs><path id="f" d="M0,-40 C-1,-30 -8,-26 -16,-18 C-25,-9 -30,2 -30,12 C-30,29 -17,40 0,40 C17,40 30,29 30,12 C30,2 25,-9 16,-18 C8,-26 1,-30 0,-40 Z"/></defs>
<rect x="0.5" y="0.5" width="719" height="369" rx="14" class="card"/>
<g transform="translate(680,44) scale(0.32)"><path class="g-stem" d="M0,-40 C1,-46 3,-50 8,-54" fill="none" stroke-width="4.5" stroke-linecap="round"/><use href="#f" class="g-skin"/><g transform="scale(0.84)"><use href="#f" class="g-mid"/></g><g transform="scale(0.70)"><use href="#f" class="g-flesh"/></g><g class="g-seed"><circle cx="0" cy="-14" r="2.1"/><circle cx="-7" cy="-6" r="2.1"/><circle cx="7" cy="-6" r="2.1"/><circle cx="-13" cy="3" r="2.1"/><circle cx="0" cy="2" r="2.1"/><circle cx="13" cy="3" r="2.1"/><circle cx="-8" cy="11" r="2.1"/><circle cx="8" cy="11" r="2.1"/><circle cx="-15" cy="12" r="2.1"/><circle cx="15" cy="12" r="2.1"/><circle cx="0" cy="19" r="2.1"/><circle cx="-7" cy="24" r="2.1"/><circle cx="7" cy="24" r="2.1"/></g></g>
<text x="28" y="36" class="t" font-size="22" text-anchor="start" font-weight="normal" >TOML stops being quadratic</text>
<text x="28" y="58" class="b" font-size="12.5" text-anchor="start" font-weight="normal" >The same commands on the 4.5 MB TOML file. 5.2 took seconds; 6.0 takes a quarter of one at most.</text>
<rect x="28" y="77" width="10" height="10" rx="2" class="soft"/>
<text x="43" y="86" class="b" font-size="12" text-anchor="start" font-weight="normal" >fig 5.2</text>
<rect x="113.2" y="77" width="10" height="10" rx="2" class="plum"/>
<text x="128.2" y="86" class="b" font-size="12" text-anchor="start" font-weight="normal" >fig 6.0</text>
<line x1="150" y1="102" x2="150" y2="260" class="axis"/>
<text x="150" y="276" class="m" font-size="11" text-anchor="middle" font-weight="normal" >0</text>
<line x1="240" y1="102" x2="240" y2="260" class="grid"/>
<text x="240" y="276" class="m" font-size="11" text-anchor="middle" font-weight="normal" >2 s</text>
<line x1="330" y1="102" x2="330" y2="260" class="grid"/>
<text x="330" y="276" class="m" font-size="11" text-anchor="middle" font-weight="normal" >4 s</text>
<line x1="420" y1="102" x2="420" y2="260" class="grid"/>
<text x="420" y="276" class="m" font-size="11" text-anchor="middle" font-weight="normal" >6 s</text>
<line x1="510" y1="102" x2="510" y2="260" class="grid"/>
<text x="510" y="276" class="m" font-size="11" text-anchor="middle" font-weight="normal" >8 s</text>
<text x="138" y="126" class="k" font-size="12.5" text-anchor="end" font-weight="normal" >TOML get</text>
<path class="soft" d="M150,112 H315.53 a4,4 0 0 1 4,4 V120 a4,4 0 0 1 -4,4 H150 Z"/>
<text x="327.53" y="122" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >3.8 s</text>
<path class="plum" d="M150,126 H152.62 a2.62,2.62 0 0 1 2.62,2.62 V135.38 a2.62,2.62 0 0 1 -2.62,2.62 H150 Z"/>
<text x="163.25" y="136" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >0.12 s</text>
<text x="138" y="164" class="k" font-size="12.5" text-anchor="end" font-weight="normal" >TOML replace</text>
<path class="soft" d="M150,150 H520.66 a4,4 0 0 1 4,4 V158 a4,4 0 0 1 -4,4 H150 Z"/>
<text x="532.66" y="160" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >8.3 s</text>
<path class="plum" d="M150,164 H156.9 a4,4 0 0 1 4,4 V172 a4,4 0 0 1 -4,4 H150 Z"/>
<text x="168.9" y="174" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >0.24 s</text>
<text x="138" y="202" class="k" font-size="12.5" text-anchor="end" font-weight="normal" >TOML convert</text>
<path class="soft" d="M150,188 H347.6 a4,4 0 0 1 4,4 V196 a4,4 0 0 1 -4,4 H150 Z"/>
<text x="359.6" y="198" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >4.5 s</text>
<path class="plum" d="M150,202 H153.57 a3.57,3.57 0 0 1 3.57,3.57 V210.43 a3.57,3.57 0 0 1 -3.57,3.57 H150 Z"/>
<text x="165.14" y="212" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >0.16 s</text>
<text x="138" y="240" class="k" font-size="12.5" text-anchor="end" font-weight="normal" >TOML fmt</text>
<path class="soft" d="M150,226 H329.1 a4,4 0 0 1 4,4 V234 a4,4 0 0 1 -4,4 H150 Z"/>
<text x="341.1" y="236" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >4.1 s</text>
<path class="plum" d="M150,240 H156.12 a4,4 0 0 1 4,4 V248 a4,4 0 0 1 -4,4 H150 Z"/>
<text x="168.12" y="250" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >0.22 s</text>
<text x="692" y="220" class="t" font-size="48" text-anchor="end" font-weight="normal" >×34</text>
<text x="692" y="242" class="b" font-size="12" text-anchor="end" font-weight="normal" >faster to replace one value</text>
<text x="28" y="306" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >5.2 walked an array of tables to the end before appending to it, so each [[services]] cost more than the last.</text>
<text x="28" y="320" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >6.0 appends a table entry, and an element of an array of tables, in constant time.</text>
<text x="28" y="334" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >Apple M3 Pro, release builds, median of 7 runs (3 for 5.2's TOML), 2026-10-14.</text>

</svg>
