[package]
name = "fig-dotenv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# fig's Rust workspace; this crate sits in its language's package.
workspace = "../../bindings/rust"
description = "dotenv for fig: fig's own parser, printer and editing rules for the language, in pure Rust, registered with fig's core."
repository = "https://github.com/diaryx-org/fig"
homepage = "https://github.com/diaryx-org/fig"
documentation = "https://docs.rs/fig-dotenv"
readme = "README.md"
keywords = ["config", "fig", "dotenv", "parser"]
categories = ["config", "parser-implementations"]
include = [
    "rust/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
path = "rust/lib.rs"

[features]
# `from_str`, `to_string` and the rest: typed values to and from dotenv
# through serde, as `serde_json`'s are. On by default; a program that maps
# its types with fig's own derive keeps `fig` and turns this off
# (`default-features = false, features = ["fig"]`).
default = ["fig", "serde"]
# `register()` and `format()`: the language through the `fig` binding. Off
# (`default-features = false`), the crate is the language alone, on
# `fig-kit`, for a program that registers it with `fig-core` itself.
fig = ["dep:fig"]
serde = ["fig", "fig/serde", "dep:serde"]

[dependencies]
# The language itself, in rust/ beside its Zig, is written on fig's kit alone.
fig-kit = { workspace = true }
fig = { workspace = true, optional = true }
serde = { version = "1", optional = true }
