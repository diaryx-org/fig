[package]
name = "fig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Parse, edit, and convert config files while preserving comments. Supports JSON, YAML, TOML, and more."
repository = "https://github.com/diaryx-org/fig"
# Rendered by crates.io on the package page. The file is the repo-root `README.md`,
# copied in by `cargo xtask vendor` before publishing (git-ignored here, so
# `include` force-adds it to the tarball — see below). A local checkout that has
# not run the vendor step simply has no README.md; cargo only requires it when
# packaging/publishing, not for `build`/`test`.
readme = "README.md"
# The core is `fig-core` (a dependency, pure Rust), so this crate packages only
# its own Rust sources plus the vendored README/licenses. No `build.rs`, no
# `links`, nothing to compile but Rust.
include = [
    "src/**/*",
    # Vendored in by `cargo xtask vendor` from the repo root (git-ignored here).
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
]

[lib]
name = "fig"
path = "src/lib.rs"

# JSON is in `default`, not implied by the base crate: `--no-default-features`
# compiles it out too (like any other language). `serde` is opt-in — the crate
# parses, edits, and serializes through the `Value` tree (and `#[derive]`) with
# no serde at all.
[features]
default = []
# Typed (de)serialization: `from_slice`/`to_value`, and serde impls for
# `Value` (`fig-yaml`'s `serde` feature adds `from_str`/`to_string`). Opt-in (not in
# `default`); without it, the binding still parses, edits, and serializes via the
# `Value` tree directly, and `#[derive(ToValue, FromValue)]` covers typed struct
# mapping.
serde = ["dep:serde"]
# Ergonomic typed mapping without serde: `#[derive(fig::ToValue, fig::FromValue)]`
# generates straight-line conversions to/from the concrete `Value` tree (no
# format-generic Visitor machinery), via the `fig-macros` proc-macro crate.
derive = ["dep:fig-macros"]
# `ToValue`/`FromValue` impls for `indexmap::IndexMap<String, T>`, preserving
# insertion order (unlike the std map impls). Opt-in to keep the dep optional.
indexmap = ["dep:indexmap"]
# `fig::helper`, which serves a `Language` over JSON-RPC on stdio. Opt-in,
# like the rest: only a helper executable needs it, and it brings
# `serde_json`, which reads and writes the wire without a registered `json`
# language.
helper = ["dep:serde_json"]

[dependencies]
# fig's core, in Rust: its registry carries no language until a program adds
# the language crates it uses (`fig-yaml`, …) and registers each.
fig-core = { workspace = true }
serde = { version = "1", optional = true }
fig-macros = { workspace = true, optional = true }
indexmap = { version = "2", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# The kit's shared fixtures (`kit/testdata/`) are JSON.
serde_json = "1"
# Every language, for the tests to read and write: each registers from its
# own crate (`tests/common` through its `register()`, `src/test_languages.rs`
# its `LANGUAGE`), with its `fig` feature and without its default `serde`,
# which would turn fig's on for a test run without it. By path alone, so
# `cargo publish` drops them: each depends on this crate, and is published
# after it.
fig-json = { path = "../../../languages/json", default-features = false, features = ["fig"] }
fig-yaml = { path = "../../../languages/yaml", default-features = false, features = ["fig", "serde"] }
fig-toml = { path = "../../../languages/toml", default-features = false, features = ["fig"] }
fig-zon = { path = "../../../languages/zon", default-features = false, features = ["fig"] }
fig-figl = { path = "../../../languages/figl", default-features = false, features = ["fig"] }
fig-ini = { path = "../../../languages/ini", default-features = false, features = ["fig"] }
fig-dotenv = { path = "../../../languages/dotenv", default-features = false, features = ["fig"] }
fig-properties = { path = "../../../languages/properties", default-features = false, features = ["fig"] }
fig-plist = { path = "../../../languages/plist", default-features = false, features = ["fig"] }
fig-nestedtext = { path = "../../../languages/nestedtext", default-features = false, features = ["fig"] }

# The helper executable `tools/cli-lang-check.sh` spawns from the CLI. The
# wire is JSON-RPC 2.0, which the `helper` module reads with `serde_json`.
[[example]]
name = "tinykv_helper"
required-features = ["helper"]

# dotenv written with `fig::kit`, served the same way, and held to the
# compiled dotenv by `tools/cli-lang-check.sh` and `tests/kit_dotenv.rs`.
[[example]]
name = "kit_dotenv_helper"
path = "examples/kit_dotenv_helper/main.rs"
required-features = ["helper"]
