name: Release (npm)
# Publish @diaryx/fig (bindings/typescript), a JS *library* (parse/edit/
# serialize as an API) backed by a freestanding wasm reactor module. Split out
# from release.figl (crates.io: fig + fig-macros) and release-npm-wasi.figl
# (the npx-able fig-wasi CLI package) so each publish, with its own required
# secret, can run (and be re-triggered) independently of the others.
#
# Runs on the `v*.*.*` tag, like every release workflow here — one tag
# releases every artifact at fig's one version (see "Release tagging" in
# docs/VERSIONING.md) — and by hand via `workflow_dispatch`, which runs it
# unconditionally. It publishes the version package.json carries, which the
# checks below hold to the tag, and no-ops if that exact version is already
# out.
#
# Required repository secret:
# NPM_TOKEN  — npm automation token with publish rights (not yet set — this
# job will fail at the publish step until it's added: `gh secret
# set NPM_TOKEN`); needs publish rights to @diaryx/fig.
on:
  workflow_dispatch: {}
  push: { tags: [v*.*.*] }
permissions: { id-token: write, contents: read }
jobs:
  npm:
    name: Publish package (npm) — fig (library)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: mlugg/setup-zig@v2
      with: { version: 0.16.0 }
    - uses: actions/setup-node@v7
      with:
        # Node 24+: the test suite uses `using` (explicit resource management),
        # which only parses under `--experimental-transform-types` type
        # stripping on Node 24 and later.
        node-version: 24
        registry-url: https://registry.npmjs.org
        cache: npm
        cache-dependency-path: bindings/typescript/package-lock.json
    # Every file carrying fig's one version agrees with build.zig.zon, and the
    # tag names that version: a tag that does not would publish a package under
    # a number the release did not cut.
    - name: Verify every file carries the one version
      run: zig build version-check
    - name: Verify tag matches the version
      if: github.ref_type == 'tag'
      run: |
        want=$(sed -n 's/^    \.version = "\([^"]*\)",$/\1/p' build.zig.zon)
        tag="${GITHUB_REF_NAME#v}"
        if [ "$want" != "$tag" ]; then
          echo "::error::tag $GITHUB_REF_NAME ($tag) != build.zig.zon version ($want)"
          exit 1
        fi
        echo "version $want matches tag $GITHUB_REF_NAME"
    - run: npm ci
      working-directory: bindings/typescript
    - run: npm run build
      working-directory: bindings/typescript
    - run: npm test
      working-directory: bindings/typescript
    # Idempotent like the crate publishes (see release.figl's `crate` job): npm
    # reports a duplicate version as E403 "cannot publish over the previously
    # published versions" — only that exact conflict is swallowed, so a bad
    # token (E401) or a forbidden scope (a different E403, e.g.
    # "Forbidden"/"do not have permission") still fails.
    - name: Publish to npm
      working-directory: bindings/typescript
      env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
      run: |
        if out=$(npm publish --access public 2>&1); then
          echo "$out"
        else
          echo "$out"
          if echo "$out" | grep -qiE 'cannot publish over|previously published|EPUBLISHCONFLICT'; then
            echo "::notice::npm version already published — skipping"
          else
            exit 1
          fi
        fi
