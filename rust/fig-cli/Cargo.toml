[package]
name = "fig-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "fig's command-line tool, in Rust"

[[bin]]
name = "fig"
path = "src/main.rs"

[dependencies]
fig-core = { path = "../fig-core" }

[features]
# fig-lsp diagnoses through the figl parser (`fig_core::lang::figl`), which
# is not ported yet: turn this on, and make it a default, when it lands.
figl = []
