title: prov config
spec: 1
content_format: markdown
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
id_storage: both
updated: ''
identity: lazy
fixity: on
recycle_bin: false
history: off
about: off
workspace_id: fig
root: README.md
# Build output under the Rust bindings carries copies of docs/ that
# cargo-semver-checks unpacks; they are not this workspace's documents.
out_of_scope:
- bindings/rust/target
- history
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  created: { type: date }
  date_of_document: { type: date }
exports:
  www:
    label: fig on diaryx.org
    gate: { field: audience, value: public }
    hold: draft
relations:
  transcription:
    cardinality: many
    inverse: transcription_of
    means: transcriptions of this document's artifact
  transcription_of:
    cardinality: many
    inverse: transcription
    means: the record this document is a transcription of
created: ''
record_deletions: false
