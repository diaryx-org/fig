title: prov config
spec: 1
content_format: markdown
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
id_storage: both
identity: lazy
fixity: on
recycle_bin: false
history: off
about: off
workspace_id: dx70bkt7z
root: README.md
# Cargo's build output (the workspace's at the root, cargo-fuzz's in fuzz/)
# can carry copies of documents; they are not this workspace's documents.
out_of_scope:
- target
- fuzz/target
- history
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  created: { type: date }
  date_of_document: { type: date }
  attachments[].content: { type: payload }
exports:
  www:
    label: fig on diaryx.org
    gate: { field: audience, value: public }
    hold: draft
relations:
  transcription:
    cardinality: many
    inverse: transcription_of
    means: transcriptions of this document's artifact
  transcription_of:
    cardinality: many
    inverse: transcription
    means: the record this document is a transcription of
record_deletions: false
