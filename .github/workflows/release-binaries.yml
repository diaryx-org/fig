name: Release binaries
# Build + attach prebuilt CLI binaries for the platforms homebrew.yml doesn't
# cover: Windows (x86_64) and a WASI module (wasm32-wasip1) runnable under any
# WASI host (wasmtime, wasmer, ...). The macOS + Linux binaries + Homebrew tap
# bump live in homebrew.yml instead — the tap's bump-formula job needs the
# Linux tarballs ready in the same workflow run (via `needs:`) to hash them,
# which two independent workflows on the same tag can't guarantee relative to
# each other.
#
# Neither of these route through a package manager (yet) — plain zip/wasm
# attached straight to the GitHub Release, downloaded by hand. Each is built
# by cargo on a runner that hosts its target: Windows on windows-latest, the
# WASI module on ubuntu-latest.
#
# Runs on the same `v*.*.*` tag as homebrew.yml — one tag releases every
# artifact (see "Release tagging" in docs/VERSIONING.md).
#
# The release's body is not written here. `release` cuts the changelog
# section the tag carries, and `release github` puts that section on the
# release page, creating it or editing it — so this only attaches files, and
# sends no body that would race it.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch: null
permissions:
  contents: write # attaches assets to the GitHub Release
jobs:
  windows:
    name: Build + attach the Windows binary
    runs-on: windows-latest
    if: github.ref_type == 'tag'
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Build Windows x86_64
      shell: pwsh
      run: |
        cargo build --release -p fig-cli --bin fig --target x86_64-pc-windows-msvc
        Compress-Archive -Path target/x86_64-pc-windows-msvc/release/fig.exe -DestinationPath fig-windows-x86_64.zip
    - name: Attach to the GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        files: fig-windows-x86_64.zip
  wasi:
    name: Build + attach the WASI binary
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with: { targets: wasm32-wasip1 }
    # Every format compiled in, as the native CLI: a WASI host other than
    # `@diaryx/fig-wasi`'s serves none (that package builds its own, which asks
    # its host for each).
    - name: Build WASI module
      run: |
        cargo build --release -p fig-cli --bin fig --target wasm32-wasip1
        cp target/wasm32-wasip1/release/fig.wasm fig-wasi.wasm
    - name: Attach to the GitHub Release
      uses: softprops/action-gh-release@v3
      with: { tag_name: '${{ github.ref_name }}', files: fig-wasi.wasm }
