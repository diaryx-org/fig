<text x="28" y="486" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >One file of 30,000 services in each format: YAML 4.5 MB, JSON 7.3 MB, TOML 4.5 MB.</text>
<text x="28" y="500" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >Apple M3 Pro, release builds, median of 7 runs, 2026-10-14. TOML has a chart of its own.</text>

