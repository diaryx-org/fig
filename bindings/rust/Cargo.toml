[workspace]
resolver = "3"
# Each language's crate sits in its language's package, languages/<name>/.
#
# fig's core and its languages are `fig-core` (rust/fig-core), pure Rust: a
# path dependency here, not a member. It stays in the rust/ workspace, whose
# CLI, LSP and conformance adapter want its default `bundle` feature; as a
# member here, `cargo test --workspace` would build it with that feature on
# and register every language before a program asked for one.
#
# `fig-sys`, the `fig-sys-*` payload crates and `fig-language-build`, which
# linked fig's Zig core as a C library, are no longer members or
# dependencies: nothing here needs Zig or a C toolchain.
members = ["fig", "fig-macros", "../../languages/*"]

[workspace.package]
version = "6.0.0"
edition = "2024"
# The oldest toolchain the workspace builds on. Edition 2024 alone needs 1.85;
# fig-macros writes let chains (`if a && let Some(x) = …`), stable since 1.88.
# Checked with `cargo +1.88 test --workspace --all-features`; 1.85 refuses the
# let chains.
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Shared across the workspace so every crate pins one set of versions. The
# internal `fig*` crates all share fig's one version, decided in build.zig.zon;
# `dx release` and `zig build version-sync` rewrite these `version = "…"` fields
# in lockstep, and `zig build version-check` fails on drift.
[workspace.dependencies]
fig-macros = { path = "fig-macros", version = "6.0.0" }
fig = { path = "fig", version = "6.0.0" }
# The core, its kit and fig's ten languages, in Rust. Without its `bundle`
# feature: the registry starts empty, and a program registers each language
# it uses through that language's crate (`fig-yaml`, …), as it did when each
# was a library linked beside fig's.
fig-core = { path = "../../rust/fig-core", version = "6.0.0", default-features = false }
fig-json = { path = "../../languages/json", version = "6.0.0" }
fig-yaml = { path = "../../languages/yaml", version = "6.0.0" }
fig-toml = { path = "../../languages/toml", version = "6.0.0" }
fig-zon = { path = "../../languages/zon", version = "6.0.0" }
fig-figl = { path = "../../languages/figl", version = "6.0.0" }
fig-ini = { path = "../../languages/ini", version = "6.0.0" }
fig-dotenv = { path = "../../languages/dotenv", version = "6.0.0" }
fig-properties = { path = "../../languages/properties", version = "6.0.0" }
fig-plist = { path = "../../languages/plist", version = "6.0.0" }
fig-nestedtext = { path = "../../languages/nestedtext", version = "6.0.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
