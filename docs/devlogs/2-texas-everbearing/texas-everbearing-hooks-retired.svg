<text x="28" y="244" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >Each hook became something the parser records about the file, or one of five renderers any language can use.</text>
<text x="28" y="258" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >That is what makes a script possible: a language describes its file, and fig does the editing.</text>
<text x="28" y="272" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >Counted from src/languages/&lt;format&gt;/&lt;format&gt;.zig at core/v2.9.0.</text>

