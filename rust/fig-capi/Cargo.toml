[package]
name = "fig-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "fig's C ABI (bindings/c/include/fig.h) over fig-core: libfig and the WebAssembly module the TypeScript binding loads"

[lib]
# `staticlib` and `cdylib` are libfig.a and libfig.so; on wasm32 the cdylib
# is fig.wasm. `rlib` lets this crate's own tests call the exports.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fig-core = { workspace = true }
fig-abi = { workspace = true }
fig-kit-capi = { workspace = true }
# fig's ten languages, each the language alone (no `fig` binding), for the
# `bundle` feature to register.
fig-json = { workspace = true, optional = true }
fig-yaml = { workspace = true, optional = true }
fig-toml = { workspace = true, optional = true }
fig-zon = { workspace = true, optional = true }
fig-figl = { workspace = true, optional = true }
fig-ini = { workspace = true, optional = true }
fig-dotenv = { workspace = true, optional = true }
fig-properties = { workspace = true, optional = true }
fig-plist = { workspace = true, optional = true }
fig-nestedtext = { workspace = true, optional = true }

[features]
# The C library bundles no language, as fig's libfig never has: a program
# registers each format it uses (`fig_language_register`). `bundle`
# preregisters fig's ten language crates instead.
bundle = [
    "dep:fig-json",
    "dep:fig-yaml",
    "dep:fig-toml",
    "dep:fig-zon",
    "dep:fig-figl",
    "dep:fig-ini",
    "dep:fig-dotenv",
    "dep:fig-properties",
    "dep:fig-plist",
    "dep:fig-nestedtext",
]
