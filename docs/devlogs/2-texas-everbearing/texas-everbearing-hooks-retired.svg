<text x="28" y="36" class="t" font-size="22" text-anchor="start" font-weight="normal" >The special cases a format used to need</text>
<text x="28" y="58" class="b" font-size="12.5" text-anchor="start" font-weight="normal" >At core 2.9, six formats handed the editor 28 custom hooks to patch up edits. At 3.0 there are none to hand over.</text>
