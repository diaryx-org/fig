<text x="28" y="36" class="t" font-size="22" text-anchor="start" font-weight="normal" >Change one value, and only that value</text>
<text x="28" y="58" class="b" font-size="12.5" text-anchor="start" font-weight="normal" >Each tool sets replicas from 3 to 4 in a hand-written file. Lines that differ afterwards; 2 is the edit itself.</text>
