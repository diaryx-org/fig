<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-label="fig 6.0's core names no language: every format, the ten fig ships included, registers with it and gets a handle">
<title>fig 6.0's core names no language: every format, the ten fig ships included, registers with it and gets a handle</title>
<style>
  .t { font-family: Iowan Old Style, Palatino, Georgia, serif }
  .b, .m, .k { font-family: Helvetica Neue, Helvetica, Arial, sans-serif }
  .mono { font-family: SF Mono, Menlo, Consolas, monospace }
  .grid, .axis, .box, .boxp, .chip, .card { stroke-width:1 }
  .ln { stroke-width:1.6; fill:none }

  .card { fill:#FAFAF9; stroke:#E3E1DC }
  .t { fill:#2C2130 } .b { fill:#5E4A66 } .m { fill:#8A7590 } .k { fill:#2C2130 }
  .plum { fill:#52355C } .pink { fill:#D4576B } .stem { fill:#7A5A37 }
  .soft { fill:#52355C; fill-opacity:.4 }
  .grid { stroke:#E3E1DC } .axis { stroke:#C7C4BD }
  .box { fill:#F2F1EE; stroke:#E3E1DC }
  .boxp { fill:#52355C; fill-opacity:.09; stroke:#52355C; stroke-opacity:.6 }
  .chip { fill:#FFFFFF; stroke:#E3E1DC }
  .ln { stroke:#52355C }
  .g-stem { stroke:#7A5A37 } .g-skin { fill:#52355C } .g-mid { fill:#F2E6D8 }
  .g-flesh { fill:#D4576B } .g-seed { fill:#F6EADC }
  @media (prefers-color-scheme: dark) {
  .card { fill:#161517; stroke:#333136 }
  .t { fill:#EFE6F1 } .b { fill:#C9B6CE } .m { fill:#8E7A96 } .k { fill:#EFE6F1 }
  .plum { fill:#7A5187 } .pink { fill:#E06A7D } .stem { fill:#B08954 }
  .soft { fill:#7A5187; fill-opacity:.4 }
  .grid { stroke:#333136 } .axis { stroke:#4A474D }
  .box { fill:#1F1E21; stroke:#333136 }
  .boxp { fill:#7A5187; fill-opacity:.09; stroke:#7A5187; stroke-opacity:.6 }
  .chip { fill:#2A292D; stroke:#333136 }
  .ln { stroke:#7A5187 }
  .g-stem { stroke:#B08954 } .g-skin { fill:#7A5187 } .g-mid { fill:#EEDFCC }
  .g-flesh { fill:#E06A7D } .g-seed { fill:#F3E4CF }
  }
</style>
<defs><path id="f" d="M0,-40 C-1,-30 -8,-26 -16,-18 C-25,-9 -30,2 -30,12 C-30,29 -17,40 0,40 C17,40 30,29 30,12 C30,2 25,-9 16,-18 C8,-26 1,-30 0,-40 Z"/></defs>
<rect x="0.5" y="0.5" width="719" height="469" rx="14" class="card"/>
<g transform="translate(680,44) scale(0.32)"><path class="g-stem" d="M0,-40 C1,-46 3,-50 8,-54" fill="none" stroke-width="4.5" stroke-linecap="round"/><use href="#f" class="g-skin"/><g transform="scale(0.84)"><use href="#f" class="g-mid"/></g><g transform="scale(0.70)"><use href="#f" class="g-flesh"/></g><g class="g-seed"><circle cx="0" cy="-14" r="2.1"/><circle cx="-7" cy="-6" r="2.1"/><circle cx="7" cy="-6" r="2.1"/><circle cx="-13" cy="3" r="2.1"/><circle cx="0" cy="2" r="2.1"/><circle cx="13" cy="3" r="2.1"/><circle cx="-8" cy="11" r="2.1"/><circle cx="8" cy="11" r="2.1"/><circle cx="-15" cy="12" r="2.1"/><circle cx="15" cy="12" r="2.1"/><circle cx="0" cy="19" r="2.1"/><circle cx="-7" cy="24" r="2.1"/><circle cx="7" cy="24" r="2.1"/></g></g>
<text x="28" y="36" class="t" font-size="22" text-anchor="start" font-weight="normal" >A core that names no language</text>
<text x="28" y="58" class="b" font-size="12.5" text-anchor="start" font-weight="normal" >In 5.2 ten formats were compiled into fig's core. In 6.0 each one registers, as any other language does.</text>
<rect x="28" y="80" width="316" height="150" rx="10" class="box"/>
<text x="44" y="106" class="t" font-size="16" text-anchor="start" font-weight="normal" >fig 5.2</text>
<text x="44" y="125" class="b" font-size="11.5" text-anchor="start" font-weight="normal" >the core knows ten formats by name</text>
<rect x="44" y="141" width="90" height="19" rx="9.5" class="chip"/>
<text x="89" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >Format.Json</text>
<rect x="140" y="141" width="90" height="19" rx="9.5" class="chip"/>
<text x="185" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >Format.Yaml</text>
<rect x="236" y="141" width="90" height="19" rx="9.5" class="chip"/>
<text x="281" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >Format.Toml</text>
<rect x="44" y="167" width="83" height="19" rx="9.5" class="chip"/>
<text x="85.5" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >Format.Zon</text>
<rect x="133" y="167" width="83" height="19" rx="9.5" class="chip"/>
<text x="174.5" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >Format.Ini</text>
<rect x="222" y="167" width="83" height="19" rx="9.5" class="chip"/>
<text x="263.5" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >Format.Fig</text>
<rect x="311" y="167" width="20" height="19" rx="9.5" class="chip"/>
<text x="321" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >…</text>
<text x="44" y="214" class="m" font-size="11" text-anchor="start" font-weight="normal" >a language taught at runtime was numbered from 4096</text>
<rect x="376" y="80" width="316" height="150" rx="10" class="boxp"/>
<text x="392" y="106" class="t" font-size="16" text-anchor="start" font-weight="normal" >fig 6.0</text>
<text x="392" y="125" class="b" font-size="11.5" text-anchor="start" font-weight="normal" >every format is a handle a registration returns</text>
<rect x="392" y="141" width="41" height="19" rx="9.5" class="chip"/>
<text x="412.5" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >json</text>
<rect x="439" y="141" width="41" height="19" rx="9.5" class="chip"/>
<text x="459.5" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >yaml</text>
<rect x="486" y="141" width="41" height="19" rx="9.5" class="chip"/>
<text x="506.5" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >toml</text>
<rect x="533" y="141" width="34" height="19" rx="9.5" class="chip"/>
<text x="550" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >zon</text>
<rect x="573" y="141" width="34" height="19" rx="9.5" class="chip"/>
<text x="590" y="154" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >ini</text>
<rect x="392" y="167" width="41" height="19" rx="9.5" class="chip"/>
<text x="412.5" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >figl</text>
<rect x="439" y="167" width="48" height="19" rx="9.5" class="chip"/>
<text x="463" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >plist</text>
<rect x="493" y="167" width="20" height="19" rx="9.5" class="chip"/>
<text x="503" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >…</text>
<rect x="519" y="167" width="55" height="19" rx="9.5" class="chip"/>
<text x="546.5" y="180" class="k mono" font-size="11" text-anchor="middle" font-weight="normal" >mylang</text>
<text x="392" y="214" class="m" font-size="11" text-anchor="start" font-weight="normal" >the ten fig ships, and yours, registered alike</text>
<path class="ln" d="M350,155 H367"/>
<path class="plum" d="M366,150 L374,155 L366,160 Z"/>
<rect x="28" y="262" width="664" height="150" rx="10" class="box"/>
<text x="44" y="288" class="t" font-size="16" text-anchor="start" font-weight="normal" >One language, wherever fig runs</text>
<text x="44" y="307" class="b" font-size="11.5" text-anchor="start" font-weight="normal" >languages/yaml is one Zig parser and printer, packaged once for each place fig is used</text>
<text x="44" y="340" class="b" font-size="11.5" text-anchor="start" font-weight="normal" >Rust</text>
<text x="44" y="360" class="k mono" font-size="12.5" text-anchor="start" font-weight="600" >fig-yaml</text>
<text x="44" y="380" class="m mono" font-size="10.5" text-anchor="start" font-weight="normal" >fig_yaml::register()</text>
<text x="202" y="340" class="b" font-size="11.5" text-anchor="start" font-weight="normal" >TypeScript</text>
<text x="202" y="360" class="k mono" font-size="12.5" text-anchor="start" font-weight="600" >@diaryx/fig-yaml</text>
<text x="202" y="380" class="m mono" font-size="10.5" text-anchor="start" font-weight="normal" >registerLanguage(yaml)</text>
<text x="360" y="340" class="b" font-size="11.5" text-anchor="start" font-weight="normal" >C</text>
<text x="360" y="360" class="k mono" font-size="12.5" text-anchor="start" font-weight="600" >libfig_yaml.a</text>
<text x="360" y="380" class="m mono" font-size="10.5" text-anchor="start" font-weight="normal" >fig_yaml_register()</text>
<text x="518" y="340" class="b" font-size="11.5" text-anchor="start" font-weight="normal" >Zig, CLI</text>
<text x="518" y="360" class="k mono" font-size="12.5" text-anchor="start" font-weight="600" >built in</text>
<text x="518" y="380" class="m mono" font-size="10.5" text-anchor="start" font-weight="normal" >-Dyaml=false drops it</text>
<text x="28" y="438" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >The authoring dialect fig ships is figl now: fig is the library's name, and no format's. A helper</text>
<text x="28" y="452" class="m" font-size="10.5" text-anchor="start" font-weight="normal" >written in any language speaks JSON-RPC 2.0 to fig, and gets a handle like the rest.</text>

</svg>
