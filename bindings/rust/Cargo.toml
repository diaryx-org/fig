[workspace]
resolver = "3"
members = ["fig", "fig-macros", "fig-sys", "fig-sys-*", "fig-json", "fig-yaml", "fig-toml", "fig-zon", "fig-figl", "fig-ini", "fig-dotenv", "fig-properties", "fig-plist", "fig-nestedtext"]

[workspace.package]
version = "6.0.0"
edition = "2024"
# The oldest toolchain the workspace builds on. Edition 2024 alone needs 1.85;
# fig-macros writes let chains (`if a && let Some(x) = …`), stable since 1.88.
# Checked with `cargo +1.88 test --workspace --all-features`; 1.85 refuses the
# let chains.
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Shared across the workspace so every crate pins one set of versions. The
# internal `fig*` crates all share fig's one version, decided in build.zig.zon;
# `dx release` and `zig build version-sync` rewrite these `version = "…"` fields
# in lockstep, and `zig build version-check` fails on drift.
[workspace.dependencies]
fig-macros = { path = "fig-macros", version = "6.0.0" }
fig = { path = "fig", version = "6.0.0" }
# fig-sys carries no language: each is a crate of its own (`fig-yaml`, …).
fig-sys = { path = "fig-sys", version = "6.0.0" }
fig-json = { path = "fig-json", version = "6.0.0" }
fig-yaml = { path = "fig-yaml", version = "6.0.0" }
fig-toml = { path = "fig-toml", version = "6.0.0" }
fig-zon = { path = "fig-zon", version = "6.0.0" }
fig-figl = { path = "fig-figl", version = "6.0.0" }
fig-ini = { path = "fig-ini", version = "6.0.0" }
fig-dotenv = { path = "fig-dotenv", version = "6.0.0" }
fig-properties = { path = "fig-properties", version = "6.0.0" }
fig-plist = { path = "fig-plist", version = "6.0.0" }
fig-nestedtext = { path = "fig-nestedtext", version = "6.0.0" }
fig-sys-macos-arm64 = { path = "fig-sys-macos-arm64", version = "6.0.0" }
fig-sys-linux-x64-gnu = { path = "fig-sys-linux-x64-gnu", version = "6.0.0" }
fig-sys-linux-arm64-gnu = { path = "fig-sys-linux-arm64-gnu", version = "6.0.0" }
fig-sys-windows-x64-msvc = { path = "fig-sys-windows-x64-msvc", version = "6.0.0" }
fig-sys-wasm32 = { path = "fig-sys-wasm32", version = "6.0.0" }
fig-sys-ios-arm64 = { path = "fig-sys-ios-arm64", version = "6.0.0" }
fig-sys-ios-arm64-sim = { path = "fig-sys-ios-arm64-sim", version = "6.0.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
