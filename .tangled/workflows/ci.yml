engine: microvm
# Tangled CI — the mirror of `.github/workflows/ci.yml`'s `check` job, for the
# copy of this repo hosted on tangled.org (pipelines there are run by a
# "spindle"; see https://docs.tangled.org/spindles).
#
# It runs the same one pre-release gate — `cargo xtask ci` — and nothing
# else: a tangled workflow file has no `jobs:`, one file *is* one job, so the
# `cross` / `typescript` / `wasi` jobs that run in parallel on GitHub would
# each need their own file here. They stay GitHub-only for now; `ci` already
# folds the TypeScript and WASI suites in where their toolchain happens to be
# present and skips them with a note where it isn't.
#
# Prerequisites, once, on the tangled side: the repo needs a spindle attached
# under Settings → Pipelines. Without one, nothing here ever fires.
#
# Push `-o skip-ci` to skip a run: `git push -o skip-ci`.
image: nixos
when:
- event: [push, manual]
  branch: [main]
- event: [pull_request]
  branch: [main]
# Only what the steps below actually reach for beyond a bare NixOS image:
# `git` for the tag baselines, `rustup` for the toolchain, `gcc` and
# `binutils` for the C ABI probes (`cc`, `c++`, `nm`) and as Rust's linker.
# nixpkgs' `rustup` patches the toolchains it downloads to run on NixOS, so
# the toolchain is the same stable release GitHub's jobs use rather than
# whatever this image's nixpkgs snapshot pinned.
dependencies: [git, rustup, gcc, binutils]
steps:
# `semver-check` diffs against the most recent release tag (`v*`),
# discovered with `git describe` — the GitHub job gets it via `fetch-depth: 0`. Spindle's clone
# depth isn't ours to set portably (`clone.depth` takes a positive count),
# so ask for the tags directly and shrug if the clone can't be deepened:
# the check degrades to "no release tag found — skipping diff" rather than
# failing, so a tag-less clone costs coverage, not a red run.
- name: Fetch tags (ABI/semver baselines)
  command: git fetch --tags --force --unshallow 2>/dev/null || git fetch --tags --force || true
# Each step is its own shell, so the toolchain's PATH is set in each.
- name: Install the Rust toolchain
  command: |
    set -euo pipefail
    rustup toolchain install stable --profile minimal
    rustup default stable
    cargo --version
# The one pre-release gate, same as the GitHub `check` job. Its TypeScript
# and WASI halves skip with a note — no Node in this image (see
# figl/ci.figl for the jobs that run them for real).
#
# If this trips the spindle's workflow timeout (5 minutes unless the
# operator raised it), split the suite across files rather than trimming it.
- name: cargo xtask ci
  command: |
    set -euo pipefail
    cargo xtask ci
